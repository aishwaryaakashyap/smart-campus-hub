<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #222;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin: 0;
            font-size: 32px;
        }

        .card p {
            color: #666;
        }

        .section {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f2f5;
        }

        #error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Placement Analytics Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <h2 id="students">0</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2 id="companies">0</h2>
            <p>Total Companies</p>
        </div>

        <div class="card">
            <h2 id="drives">0</h2>
            <p>Total Placement Drives</p>
        </div>

        <div class="card">
            <h2 id="applications">0</h2>
            <p>Total Applications</p>
        </div>

        <div class="card">
            <h2 id="selected">0</h2>
            <p>Selected Students</p>
        </div>

        <div class="card">
            <h2 id="selectionRate">0%</h2>
            <p>Selection Rate</p>
        </div>

    </div>

    <div class="section">
        <h2>Application Status</h2>

        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Count</th>
                </tr>
            </thead>

            <tbody id="statusTable"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>Company Analytics</h2>

        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Drives</th>
                    <th>Applications</th>
                    <th>Selected</th>
                    <th>Selection Rate</th>
                </tr>
            </thead>

            <tbody id="companyTable"></tbody>
        </table>
    </div>

    <div id="error"></div>

    <script>
        fetch('/api/analytics/placement')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Unable to load analytics');
                }
                return response.json();
            })
            .then(data => {

                document.getElementById('students').textContent =
                    data.total_students;

                document.getElementById('companies').textContent =
                    data.total_companies;

                document.getElementById('drives').textContent =
                    data.total_drives;

                document.getElementById('applications').textContent =
                    data.total_applications;

                document.getElementById('selected').textContent =
                    data.selected_count;

                document.getElementById('selectionRate').textContent =
                    data.selection_rate_percent + '%';

                const statusTable =
                    document.getElementById('statusTable');

                Object.entries(data.application_status_counts)
                    .forEach(([status, count]) => {

                        const row = document.createElement('tr');

                        row.innerHTML = `
                            <td>${status}</td>
                            <td>${count}</td>
                        `;

                        statusTable.appendChild(row);
                    });

                const companyTable =
                    document.getElementById('companyTable');

                data.company_analytics.forEach(company => {

                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${company.company_name}</td>
                        <td>${company.drive_count}</td>
                        <td>${company.application_count}</td>
                        <td>${company.selected_count}</td>
                        <td>${company.selection_rate_percent}%</td>
                    `;

                    companyTable.appendChild(row);
                });
            })
            .catch(error => {
                document.getElementById('error').textContent =
                    error.message;
            });
    </script>

</body>
</html>
