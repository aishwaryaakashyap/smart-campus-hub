<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="referrer" content="no-referrer">
    <title>Forgot Password | Smart Campus Hub</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f5f5;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 42px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(65, 20, 35, 0.10);
        }

        .brand {
            color: #762642;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 28px;
        }

        h1 {
            color: #351421;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777078;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #40323a;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ded6da;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #762642;
            box-shadow: 0 0 0 3px rgba(118, 38, 66, 0.10);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #762642;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #57182e;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.6;
        }

        #message.error {
            color: #b42318;
        }

        #message.success {
            color: #187344;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #762642;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">SMART CAMPUS HUB</div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address. If your account exists,
            we will send you instructions to reset your password.
            This works for students, coordinators and advisors.
        </p>

        <form id="forgotForm">
            <label for="email">Registered Email Address</label>

            <input
                type="email"
                id="email"
                maxlength="120"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit" id="submitButton">
                Send Reset Link
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a class="back-link" href="/api/auth/login-page">
            Back to Login
        </a>
    </main>

    <script>
        const form = document.getElementById("forgotForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        const csrfToken = document.querySelector(
            'meta[name="csrf-token"]'
        ).content;

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            message.textContent = "";
            message.className = "";
            button.disabled = true;
            button.textContent = "Sending...";

            try {
                const response = await fetch(
                    "/api/auth/forgot-password",
                    {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken
                        },
                        body: JSON.stringify({
                            email: document.getElementById("email").value.trim()
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        data.error || "Unable to process your request.";
                    message.className = "error";
                    return;
                }

                message.textContent = data.message;
                message.className = "success";

            } catch (error) {
                message.textContent =
                    "Unable to connect to the server. Please try again.";
                message.className = "error";

            } finally {
                button.disabled = false;
                button.textContent = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
